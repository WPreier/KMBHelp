# Replace 192.0.2.10 with the internal address of this server.
# That address is API_HOST. The proxy target stays off the loopback address.

<VirtualHost *:80>
    ServerName helpdesk.kmbcloud.at
    DocumentRoot /var/www/acme

    Alias /.well-known/acme-challenge/ /var/www/acme/.well-known/acme-challenge/
    <Directory /var/www/acme/.well-known/acme-challenge/>
        Require all granted
        Options None
    </Directory>

    RewriteEngine On
    RewriteRule ^/\.well-known/acme-challenge/ - [L]
    RewriteRule ^ https://helpdesk.kmbcloud.at%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName helpdesk.kmbcloud.at
    DocumentRoot /opt/kmbhelp/apps/web/dist

    SSLEngine on
    SSLCertificateFile /etc/kmbhelp/tls/fullchain.pem
    SSLCertificateKeyFile /etc/kmbhelp/tls/privkey.pem

    ProxyPreserveHost On
    ProxyPass /api/ http://192.0.2.10:3000/api/
    ProxyPassReverse /api/ http://192.0.2.10:3000/api/

    FallbackResource /index.html
    <Directory /opt/kmbhelp/apps/web/dist>
        Require all granted
    </Directory>
</VirtualHost>
