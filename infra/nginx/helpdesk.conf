# Replace 192.0.2.10 with the internal address of this server.
# That address is API_HOST. The proxy target stays off the loopback address.

server {
    listen 80;
    server_name helpdesk.kmbcloud.at;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://helpdesk.kmbcloud.at$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name helpdesk.kmbcloud.at;

    ssl_certificate /etc/kmbhelp/tls/fullchain.pem;
    ssl_certificate_key /etc/kmbhelp/tls/privkey.pem;

    root /opt/kmbhelp/apps/web/dist;
    index index.html;

    location /api/ {
        proxy_pass http://192.0.2.10:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
